openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: drafting
    description: Care study section drafting
paths:
  /sections/draft:
    post:
      operationId: draftSection
      tags: [drafting]
      summary: Draft one care study section via the RAG engine
      description: >-
        Runs the local Python RAG pipeline (retrieval + Claude) for a section.
        Returns the drafted text, or a transparent dry-run report when no
        ANTHROPIC_API_KEY is available on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [heading, notes]
              properties:
                heading:
                  type: string
                  example: 1.10 Literature Review
                notes:
                  type: string
                  description: The student's own clinical notes for the section
      responses:
        "200":
          description: Drafted section text
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft:
                    type: string
        "422":
          description: Missing heading or notes
        "500":
          description: Drafting failed
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

