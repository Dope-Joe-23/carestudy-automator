# ============================================================================
# Render Blueprint — Backend API Server
# ============================================================================
# This blueprint defines:
#   1. A PostgreSQL database
#   2. A Docker-based web service for the API server
#   3. A persistent disk for RAG indexes and uploaded files
#
# Deploy via Render Dashboard:
#   1. Push this repo to GitHub/GitLab
#   2. Go to render.com → New → Blueprint
#   3. Connect your repo and select this render.yaml
#   4. Set environment variables in the dashboard
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Server (Node.js + Python RAG engine)
  # ---------------------------------------------------------------------------
  - type: web
    name: carestudy-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter  # 512 MB RAM; upgrade to "standard" (2 GB) when memory is tight
    healthCheckPath: /api/health
    # Persistent disk for RAG indexes and uploaded study files.
    # The RAG worker writes pickled TF-IDF indexes here, and the API
    # server stores uploaded documents. Without this mount every deploy
    # wipes the indexes and files, forcing a full re-ingest.
    disk:
      name: app-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: PORT
        value: 5000
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: carestudy-db
          property: connectionString
      - key: PYTHON_BIN
        value: python3
      # ── API Keys (set these in Render Dashboard) ──
      - key: ANTHROPIC_AUTH_TOKEN
        sync: false  # Set manually — secret
      - key: ANTHROPIC_BASE_URL
        value: https://openrouter.ai/api
      - key: ANTHROPIC_MODEL
        value: openai/gpt-oss-20b:free
      # Optional paid-model fallback list. When unset, the application retries
      # failed or empty free-model responses through openrouter/free.
      - key: ANTHROPIC_FALLBACK_MODELS
        sync: false
      # ── Admin credentials (set these in Render Dashboard) ──
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false  # Set manually — secret
      # ── Upload limits ──
      - key: MAX_UPLOAD_MB
        value: "250"
      # ── Cloudflare R2 (optional — set in Render Dashboard) ──
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # ── NurseFlow teaching visuals ──
      # Default provider: Cloudflare Workers AI still images (the learner page
      # animates them with CSS). Needs a token whose permissions include
      # Account -> Workers AI -> Edit. CLOUDFLARE_ACCOUNT_ID is shared with
      # the R2 block above. Without the token the visual routes answer 503
      # with setup guidance and the feed keeps using the placeholder.
      - key: CLOUDFLARE_API_TOKEN
        sync: false  # Set manually — secret
      # Opt in to real 8-second clips instead (paid, no free tier):
      # set NURSEFLOW_VISUAL_PROVIDER=veo plus a Gemini key in the dashboard.
      - key: GEMINI_API_KEY
        sync: false  # Set manually — secret
      # Generated job records and cached images/clips. Both default under
      # ./data, which is the mounted disk below; set them explicitly to keep
      # assets across redeploys.
      - key: NURSEFLOW_VIDEO_PATH
        value: /app/data/nurseflow/video-jobs.json
      - key: NURSEFLOW_VIDEO_DIR
        value: /app/data/nurseflow/videos
      # Anonymous trial + access records and the question bank. The mounted
      # disk keeps trial counters and imported cards across redeploys.
      - key: NURSEFLOW_ACCESS_PATH
        value: /app/data/nurseflow/access.json
      - key: NURSEFLOW_CONTENT_PATH
        value: /app/data/nurseflow/question-bank.json
      # ── NurseFlow Plus payments (Paystack) ──
      # Without the secret key checkout answers 503 (fail-closed). The public
      # key is a FRONTEND build var (VITE_PAYSTACK_PUBLIC_KEY) — set it where
      # the carestudy-assistant is built, never here.
      - key: PAYSTACK_SECRET_KEY
        sync: false  # Set manually — secret
      - key: NURSEFLOW_MONTHLY_PRICE_GHS
        value: "35"

databases:
  # ---------------------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------------------
  - name: carestudy-db
    plan: starter  # 1 GB storage, free tier available
    databaseName: carestudy
    user: carestudy
