# ============================================================================
# Docker Compose — Local development and testing
# ============================================================================
# Usage:
#   docker compose up              # Start API server + PostgreSQL
#   docker compose up -d           # Start in detached mode
#   docker compose down            # Stop and remove containers
#   docker compose logs -f api     # Follow API server logs
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: carestudy
      POSTGRES_USER: carestudy
      POSTGRES_PASSWORD: carestudy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carestudy -d carestudy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # API Server (Node.js + Python RAG engine)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://carestudy:carestudy_dev_password@db:5432/carestudy
      PYTHON_BIN: python3
      # Set your API keys here or in a .env file
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://openrouter.ai/api}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-openai/gpt-oss-20b:free}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      MAX_UPLOAD_MB: "250"
      # Cloudflare R2 (optional — leave blank for local base64 uploads)
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_data:/app/data

volumes:
  postgres_data:
  api_data:
